services:
  api-adcode:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api-adcode-dev
    env_file:
      - .env
    command:
      [
        "sh",
        "-lc",
        "npm install && npm run prisma:generate --workspace @adcode/api && (npm run prisma:migrate:prod --workspace @adcode/api || echo 'WARN: migrations not applied (create DB/migrations first)') && (npm run db:seed --workspace @adcode/api || echo 'WARN: seed skipped') && npm run dev --workspace @adcode/api"
      ]
    volumes:
      - .:/workspace
      - /workspace/node_modules
    ports:
      - "${API_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4100/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - red-desarrollo

  web-adcode:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web-adcode-dev
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command:
      [
        "sh",
        "-lc",
        "npm install && npm run dev --workspace @adcode/web -- --host 0.0.0.0 --port 4173"
      ]
    volumes:
      - .:/workspace
      - /workspace/node_modules
    depends_on:
      api-adcode:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4173}:4173"
    networks:
      - red-desarrollo

networks:
  red-desarrollo:
    external: true
