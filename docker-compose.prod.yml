services:
  api-adcode:
    image: gonmore14/api-adcode:${APP_VERSION:-latest}
    container_name: api-adcode
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-latest}
    ports:
      - "4200:4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4100/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - red-interna

  web-adcode:
    image: gonmore14/web-adcode:${APP_VERSION:-latest}
    container_name: web-adcode
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api-adcode:
        condition: service_healthy
    ports:
      - "4273:80"
    networks:
      - red-interna

  api-migrate:
    image: gonmore14/api-adcode:${APP_VERSION:-latest}
    container_name: api-adcode-migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: ["npm", "run", "prisma:migrate:prod", "--workspace", "@adcode/api"]
    networks:
      - red-interna
    profiles:
      - tools

  api-seed:
    image: gonmore14/api-adcode:${APP_VERSION:-latest}
    container_name: api-adcode-seed
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: ["npm", "run", "db:seed:prod", "--workspace", "@adcode/api"]
    networks:
      - red-interna
    profiles:
      - tools

networks:
  red-interna:
    external: true
    name: ${DOCKER_EXTERNAL_NETWORK:-red-interna}
